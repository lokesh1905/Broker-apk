<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker Book</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('bb-theme')||''}catch(e){}</script>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2b2a;--mute:#6b7775;--line:#dcd8cf;--pri:#0f5c52;--pri2:#e6f0ee;--warn:#b4531a;--red:#a8323a;--grn:#1f7a45;--onpri:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141a19;--card:#1e2625;--ink:#e8eeed;--mute:#93a19e;--line:#33403e;--pri:#4fb3a3;--pri2:#223533;--warn:#e08a4c;--red:#e0707a;--grn:#5cc98a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px)}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}
header h1{font-size:18px;margin:0;flex:1;font-weight:600}
#burger{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:2px 6px}
#status{font-size:12px;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:99px;border:0;color:#fff}
#drawer{position:fixed;inset:0 auto 0 0;width:250px;max-width:80%;background:var(--card);z-index:20;transform:translateX(-100%);transition:transform .2s;padding:16px 0;box-shadow:2px 0 14px rgba(0,0,0,.25);padding-top:calc(16px + env(safe-area-inset-top,0px))}
#drawer.open{transform:none}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;display:none}
#shade.open{display:block}
#drawer h2{margin:0 18px 12px;font-size:17px}
#drawer button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:var(--ink);font-size:16px;padding:14px 18px;border-left:4px solid transparent}
#drawer button.on{background:var(--pri2);border-left-color:var(--pri);font-weight:600}
main{padding:12px 12px 90px;max-width:640px;margin:auto}
.page{display:none}.page.on{display:block}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:8px;padding:13px 16px;font:inherit;font-weight:600}
.btn.alt{background:var(--pri2);color:var(--pri)}
.btn.sm{padding:7px 11px;font-size:14px;font-weight:500}
.btn.red{background:none;color:var(--red);border:1px solid var(--red)}
.save{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;z-index:4}
.save .btn{flex:1}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pics div{position:relative;width:78px;height:78px}
.pics img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.pics b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{margin:0;font-size:17px}
.card .meta{color:var(--mute);font-size:14px;margin:2px 0 6px}
.price{font-weight:700;color:var(--pri);margin:4px 0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:0}
.tag.Available{background:#dcf3e5;color:var(--grn)}.tag.Sold,.tag.Rented{background:#f6dcdf;color:var(--red)}
@media(prefers-color-scheme:dark){.tag.Available{background:#1f3b2d}.tag.Sold,.tag.Rented{background:#40242a}}
.kv{font-size:14px;margin:2px 0}.kv span{color:var(--mute)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.thumbs img{height:84px;border-radius:8px;flex:none}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:flex;align-items:center;gap:6px;background:var(--pri2);color:var(--pri);padding:6px 6px 6px 12px;border-radius:99px;font-size:14px}
.chip button{border:0;background:none;color:var(--red);font-size:18px;line-height:1;padding:0 6px}
.note{font-size:13px;color:var(--mute);margin:6px 0}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;display:none;font-size:14px}
#lb{position:fixed;inset:0;background:#000e;z-index:40;display:none;align-items:center;justify-content:center}
#lb img{max-width:96%;max-height:92%}
html[data-theme^=sleek]{--red:#e5484d}
html[data-theme=sleek]{--bg:#f5f6fa;--card:#fff;--ink:#14171f;--mute:#7a8194;--line:#e8eaf1;--pri:#3b5bfd;--pri2:#eef1ff;--grn:#12a05c;--hbg:rgba(255,255,255,.88);--tagA:#e3f6ec;--tagS:#fdeaea;color-scheme:light}
html[data-theme=sleekdark]{--bg:#0e1015;--card:#171a22;--ink:#eceef5;--mute:#8b93a7;--line:#262b38;--pri:#7c93ff;--pri2:#1f2538;--grn:#4cd08a;--hbg:rgba(23,26,34,.88);--tagA:#173a2a;--tagS:#3d1f24;--onpri:#0e1015;color-scheme:dark}
html[data-theme^=sleek] header{background:var(--hbg);backdrop-filter:blur(10px);color:var(--ink);border-bottom:1px solid var(--line)}
html[data-theme^=sleek] #burger{color:var(--ink)}
html[data-theme^=sleek] #status{background:var(--pri2);color:var(--pri)}
html[data-theme^=sleek] .card{border:0;border-radius:16px;box-shadow:0 1px 2px rgba(20,23,31,.04),0 8px 24px rgba(20,23,31,.06)}
html[data-theme=sleekdark] .card{box-shadow:0 0 0 1px var(--line)}
html[data-theme^=sleek] input,html[data-theme^=sleek] select,html[data-theme^=sleek] textarea{border-radius:12px}
html[data-theme^=sleek] .btn{border-radius:12px}
html[data-theme^=sleek] .tag.Available{background:var(--tagA);color:var(--grn)}
html[data-theme^=sleek] .tag.Sold,html[data-theme^=sleek] .tag.Rented{background:var(--tagS);color:var(--red)}
html[data-theme^=sleek] #drawer{border-radius:0 20px 20px 0}
html[data-theme^=sleek] .save{background:var(--hbg);backdrop-filter:blur(10px)}
#fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:var(--onpri);font-size:32px;line-height:1;display:none;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:6}
</style>
</head>
<body>
<header>
  <button id="burger" aria-label="Menu">☰</button>
  <h1 id="title">New entry</h1>
  <button id="status" aria-label="Sync status">…</button>
</header>
<div id="shade"></div>
<nav id="drawer">
  <h2>Broker Book</h2>
  <div id="menu"></div>
</nav>

<main>
<section class="page" id="p-add">
  <form id="f" onsubmit="return false">
    <label>Mobile number</label><input id="mobile" type="tel" inputmode="tel">
    <label>Name</label><input id="name">
    <div class="row">
      <div><label>Rent / Sale</label><select id="deal"><option>Rent</option><option>Sale</option></select></div>
      <div><label>Flat type</label><select id="ftype"></select></div>
    </div>
    <div id="rentBox" class="row">
      <div><label>Monthly rent (₹)</label><input id="rent" type="number" inputmode="numeric"></div>
      <div><label>Deposit (₹)</label><input id="deposit" type="number" inputmode="numeric"></div>
    </div>
    <div id="saleBox" hidden><label>Sale price (₹)</label><input id="price" type="number" inputmode="numeric"></div>
    <div class="row">
      <div><label>Area</label><input id="area"></div>
      <div><label>Apartment name</label><input id="apt"></div>
    </div>
    <label>Google Maps link</label>
    <div class="row"><input id="map" type="url" placeholder="Paste link or use location"><button type="button" class="btn alt" id="locBtn" style="flex:0 0 auto">Use my location</button></div>
    <label>Photos</label>
    <div class="row">
      <button type="button" class="btn alt" id="camBtn">Take photo</button>
      <button type="button" class="btn alt" id="galBtn">Upload</button>
    </div>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <input id="gal" type="file" accept="image/*" multiple hidden>
    <div class="pics" id="pics"></div>
    <label>Status</label>
    <select id="status2"><option>Available</option><option>Sold</option><option>Rented</option></select>
    <div id="customBox"></div>
  </form>
  <div class="save">
    <button class="btn alt" id="clearBtn" style="flex:0 0 auto">Clear</button>
    <button class="btn" id="saveBtn">Save</button>
  </div>
</section>

<section class="page" id="p-list">
  <div class="chips" id="filters"></div>
  <div id="listOut"></div>
</section>

<section class="page" id="p-search">
  <input id="q" type="search" placeholder="Search name, number, area, apartment, any field…">
  <div id="searchOut" style="margin-top:12px"></div>
</section>

<section class="page" id="p-settings">
  <h3>Custom fields</h3>
  <p class="note">Fields you add here show up on every new entry (reference, alias, floor, anything).</p>
  <div class="row"><input id="newField" placeholder="Field name, e.g. Ref"><button class="btn" id="addField" style="flex:0 0 auto">Add</button></div>
  <div class="chips" id="fieldChips"></div>

  <h3>Flat types</h3>
  <div class="row"><input id="newType" placeholder="e.g. 3 BHK, Shop, Plot"><button class="btn" id="addType" style="flex:0 0 auto">Add</button></div>
  <div class="chips" id="typeChips"></div>

  <h3>Menu order</h3>
  <p class="note">Move items up or down. Saved entries opens first on reload.</p>
  <div id="menuList"></div>
  <h3>Default theme</h3>
  <p class="note">Used every time the app opens.</p>
  <select id="theme"><option value="light">Sleek light</option><option value="dark">Sleek dark</option><option value="auto">Auto (follows phone)</option><option value="classic">Classic</option></select>

  <h3>Excel</h3>
  <p class="note" id="xlInfo"></p>
  <label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px"><input type="checkbox" id="auto" style="width:auto"> Download updated Excel after every save</label>
  <div style="margin-top:12px"><button class="btn" id="xlNow">Download Excel now</button></div>
</section>
</main>

<button id="fab" aria-label="New entry">+</button>
<div id="toast"></div>
<div id="lb"><img alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const DEF_TYPES=['1 RK','1 BHK','2 BHK','3 BHK','4 BHK'];
let db,entries=[],cfg={fields:[],types:DEF_TYPES.slice(),auto:false,lastExport:null,menu:['add','list','search','settings'],theme:'light'},pics=[],editId=null,filter='All';

/* ---------- storage (IndexedDB: survives closing the browser) ---------- */
function open(){return new Promise((res,rej)=>{const r=indexedDB.open('brokerbook',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('entries',{keyPath:'id'});r.result.createObjectStore('cfg')};
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const p=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const saveCfg=()=>p(tx('cfg','readwrite').put(cfg,'cfg'));

/* ---------- helpers ---------- */
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>n===''||n==null?'':'₹'+Number(n).toLocaleString('en-IN');
function priceLine(e){return e.deal==='Rent'?`${inr(e.rent)}/month · Deposit ${inr(e.deposit)}`:inr(e.price)}

/* ---------- navigation ---------- */
const titles={add:'New entry',list:'Saved entries',search:'Search',settings:'Settings'};
function go(pg){
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==='p-'+pg));
 document.querySelectorAll('#drawer button').forEach(b=>b.classList.toggle('on',b.dataset.p===pg));
 $('title').textContent=pg==='add'&&editId?'Edit entry':titles[pg];
 $('drawer').classList.remove('open');$('shade').classList.remove('open');
 $('fab').style.display=pg==='list'?'flex':'none';
 if(pg==='list')renderList();if(pg==='search')renderSearch();if(pg==='settings')renderSettings();
 window.scrollTo(0,0);
}
$('fab').onclick=()=>{resetForm();go('add')};
$('burger').onclick=()=>{$('drawer').classList.add('open');$('shade').classList.add('open')};
$('shade').onclick=()=>{$('drawer').classList.remove('open');$('shade').classList.remove('open')};
function renderMenu(){const c=document.querySelector('.page.on'),pg=c?c.id.slice(2):'';
 $('menu').innerHTML=cfg.menu.map(k=>`<button data-p="${k}" class="${k===pg?'on':''}">${titles[k]}${k==='list'?` <span>${entries.length}</span>`:''}</button>`).join('')}
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.p;if(k==='add'&&!editId)resetForm();go(k)};

/* ---------- form ---------- */
function fillTypes(sel){const s=$('ftype');s.innerHTML=cfg.types.map(t=>`<option>${esc(t)}</option>`).join('');if(sel&&!cfg.types.includes(sel))s.insertAdjacentHTML('beforeend',`<option>${esc(sel)}</option>`);if(sel)s.value=sel}
function fillCustom(vals={}){$('customBox').innerHTML=cfg.fields.map((f,i)=>`<label>${esc(f)}</label><input data-cf="${esc(f)}" value="${esc(vals[f]||'')}">`).join('')}
function toggleDeal(){const r=$('deal').value==='Rent';$('rentBox').hidden=!r;$('saleBox').hidden=r;
 const st=$('status2');st.innerHTML=`<option>Available</option><option>${r?'Rented':'Sold'}</option>`}
$('deal').onchange=toggleDeal;
function resetForm(){editId=null;pics=[];$('f').reset();toggleDeal();fillTypes();fillCustom();renderPics()}
$('clearBtn').onclick=()=>{resetForm();go('add')};
function renderPics(){$('pics').innerHTML=pics.map((s,i)=>`<div><img src="${s}" alt=""><b data-i="${i}">×</b></div>`).join('')}
$('pics').onclick=e=>{if(e.target.dataset.i!=null){pics.splice(+e.target.dataset.i,1);renderPics()}}
$('camBtn').onclick=()=>$('cam').click();$('galBtn').onclick=()=>$('gal').click();
function shrink(file){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};
 im.onerror=()=>res(null);im.src=u})}
async function addFiles(inp){for(const f of inp.files){const d=await shrink(f);if(d)pics.push(d)}inp.value='';renderPics()}
$('cam').onchange=()=>addFiles($('cam'));$('gal').onchange=()=>addFiles($('gal'));

$('saveBtn').onclick=async()=>{
 const mobile=$('mobile').value.trim(),name=$('name').value.trim();
 if(!mobile&&!name){toast('Enter a name or mobile number');return}
 const custom={};document.querySelectorAll('[data-cf]').forEach(i=>custom[i.dataset.cf]=i.value.trim());
 const old=entries.find(x=>x.id===editId);
 const e={id:editId||('e'+Date.now()),created:old?old.created:Date.now(),updated:Date.now(),
  mobile,name,deal:$('deal').value,ftype:$('ftype').value,rent:$('rent').value,deposit:$('deposit').value,price:$('price').value,
  area:$('area').value.trim(),apt:$('apt').value.trim(),map:$('map').value.trim(),status:$('status2').value,custom,pics:pics.slice()};
 if(e.deal==='Rent')e.price='';else{e.rent='';e.deposit=''}
 try{await p(tx('entries','readwrite').put(e))}catch(x){toast('Could not save: '+x.message);return}
 await load();toast('Saved');resetForm();updateStatus();
 if(cfg.auto)exportXlsx(true);
 go('list');
};

/* ---------- list / search ---------- */
async function load(){entries=(await p(tx('entries').getAll())).sort((a,b)=>b.updated-a.updated);renderMenu()}
function card(e){
 const cf=Object.entries(e.custom||{}).filter(([k,v])=>v).map(([k,v])=>`<div class="kv"><span>${esc(k)}:</span> ${esc(v)}</div>`).join('');
 const wa=(e.mobile||'').replace(/\D/g,'');
 return `<div class="card" data-id="${e.id}">
 <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
  <div><h3>${esc(e.name||'(no name)')}</h3><div class="meta">${esc(e.mobile)}</div></div>
  <button class="tag ${e.status}" data-a="tog">${e.status}</button></div>
 <div class="kv"><b>${esc(e.deal)}</b> · ${esc(e.ftype)}</div>
 <div class="price">${priceLine(e)}</div>
 ${e.apt||e.area?`<div class="kv">${esc([e.apt,e.area].filter(Boolean).join(', '))}</div>`:''}
 ${cf}
 ${e.pics.length?`<div class="thumbs">${e.pics.map(s=>`<img src="${s}" data-a="zoom" alt="">`).join('')}</div>`:''}
 <div class="acts">
  ${e.mobile?`<a class="btn sm" href="tel:${esc(e.mobile)}">Call</a>`:''}
  ${wa?`<a class="btn sm alt" href="https://wa.me/${wa.length===10?'91'+wa:wa}" target="_blank" rel="noopener">WhatsApp</a>`:''}
  ${e.map?`<a class="btn sm alt" href="${esc(e.map)}" target="_blank" rel="noopener">Map</a>`:''}
  <button class="btn sm alt" data-a="edit">Edit</button>
  <button class="btn sm red" data-a="del">Delete</button>
 </div></div>`}
function bindCards(box){box.onclick=async ev=>{
 const a=ev.target.dataset.a;if(!a)return;const c=ev.target.closest('.card'),e=c&&entries.find(x=>x.id===c.dataset.id);
 if(a==='zoom'){$('lb').firstElementChild.src=ev.target.src;$('lb').style.display='flex'}
 if(a==='tog'){e.status=e.status==='Available'?(e.deal==='Rent'?'Rented':'Sold'):'Available';e.updated=Date.now();await p(tx('entries','readwrite').put(e));await load();refresh();updateStatus();if(cfg.auto)exportXlsx(true)}
 if(a==='del'&&confirm('Delete this entry?')){await p(tx('entries','readwrite').delete(e.id));await load();refresh();updateStatus();if(cfg.auto)exportXlsx(true)}
 if(a==='edit'){editId=e.id;pics=e.pics.slice();
  $('mobile').value=e.mobile;$('name').value=e.name;$('deal').value=e.deal;toggleDeal();fillTypes(e.ftype);
  $('rent').value=e.rent;$('deposit').value=e.deposit;$('price').value=e.price;$('area').value=e.area;$('apt').value=e.apt;$('map').value=e.map;
  $('status2').value=e.status;fillCustom(e.custom);
  // keep values of custom fields that were later removed from settings
  renderPics();go('add')}
}}
$('lb').onclick=()=>$('lb').style.display='none';
function refresh(){renderList();renderSearch()}
function renderList(){
 const sts=['All','Available','Sold','Rented'];
 $('filters').innerHTML=sts.map(s=>`<button class="chip" style="border:0;${filter===s?'background:var(--pri);color:var(--onpri)':''}" data-f="${s}">${s}</button>`).join('');
 $('filters').onclick=e=>{if(e.target.dataset.f){filter=e.target.dataset.f;renderList()}};
 const l=entries.filter(e=>filter==='All'||e.status===filter);
 $('listOut').innerHTML=l.length?l.map(card).join(''):'<div class="empty">No entries yet. Add one from New entry.</div>';
 bindCards($('listOut'));
}
function renderSearch(){
 const q=$('q').value.trim().toLowerCase();
 if(!q){$('searchOut').innerHTML='<div class="empty">Type anything to find matching entries.</div>';return}
 const words=q.split(/\s+/);
 const l=entries.filter(e=>{const hay=[e.mobile,e.name,e.deal,e.ftype,e.rent,e.deposit,e.price,e.area,e.apt,e.map,e.status,...Object.entries(e.custom||{}).flat()].join(' ').toLowerCase();return words.every(w=>hay.includes(w))});
 $('searchOut').innerHTML=l.length?`<div class="note">${l.length} found</div>`+l.map(card).join(''):'<div class="empty">Nothing matches.</div>';
 bindCards($('searchOut'));
}
$('q').oninput=renderSearch;

/* ---------- settings ---------- */
function chips(box,arr,kind){$(box).innerHTML=arr.map((x,i)=>`<span class="chip">${esc(x)}<button data-k="${kind}" data-i="${i}" aria-label="Remove">×</button></span>`).join('')||'<span class="note">None yet</span>'}
function renderSettings(){chips('fieldChips',cfg.fields,'fields');chips('typeChips',cfg.types,'types');$('auto').checked=cfg.auto;
 $('menuList').innerHTML=cfg.menu.map((k,i)=>`<div class="card" style="display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:6px"><span style="flex:1">${titles[k]}</span><button class="btn sm alt" data-mv="${i}" data-d="-1" ${i?'':'disabled'}>↑</button><button class="btn sm alt" data-mv="${i}" data-d="1" ${i<cfg.menu.length-1?'':'disabled'}>↓</button></div>`).join('');
 $('theme').value=cfg.theme;
 $('xlInfo').textContent=cfg.lastExport?'Last Excel file: '+new Date(cfg.lastExport).toLocaleString('en-IN'):'No Excel file downloaded yet.'}
$('p-settings').onclick=async e=>{const mv=e.target.dataset.mv;
 if(mv!=null){const i=+mv,j=i+ +e.target.dataset.d;[cfg.menu[i],cfg.menu[j]]=[cfg.menu[j],cfg.menu[i]];await saveCfg();renderSettings();renderMenu();return}
 const k=e.target.dataset.k;if(!k)return;
 if(confirm(`Remove "${cfg[k][e.target.dataset.i]}"? Saved entries keep their data.`)){cfg[k].splice(e.target.dataset.i,1);await saveCfg();renderSettings();fillTypes();fillCustom()}};
$('addField').onclick=async()=>{const v=$('newField').value.trim();if(!v)return;if(!cfg.fields.includes(v))cfg.fields.push(v);$('newField').value='';await saveCfg();renderSettings();fillCustom()};
$('addType').onclick=async()=>{const v=$('newType').value.trim();if(!v)return;if(!cfg.types.includes(v))cfg.types.push(v);$('newType').value='';await saveCfg();renderSettings();fillTypes()};
$('auto').onchange=async()=>{cfg.auto=$('auto').checked;await saveCfg();updateStatus()};
$('xlNow').onclick=()=>exportXlsx(false);

/* ---------- Excel export ---------- */
function rows(){
 const keys=[...new Set([...cfg.fields,...entries.flatMap(e=>Object.keys(e.custom||{}))])];
 return entries.map(e=>{const r={'Date':new Date(e.created).toLocaleDateString('en-IN'),'Name':e.name,'Mobile':e.mobile,'Rent/Sale':e.deal,'Flat type':e.ftype,
  'Monthly rent':e.rent,'Deposit':e.deposit,'Sale price':e.price,'Area':e.area,'Apartment':e.apt,'Map link':e.map,'Status':e.status,'Photos':e.pics.length};
  keys.forEach(k=>r[k]=(e.custom||{})[k]||'');return r})}
async function saveXlsx(wb,silent){
 const C=window.Capacitor;
 if(!(C&&C.isNativePlatform&&C.isNativePlatform())){XLSX.writeFile(wb,'broker-entries.xlsx');return}
 const FS=C.Plugins.Filesystem,data=XLSX.write(wb,{type:'base64',bookType:'xlsx'});let r;
 try{r=await FS.writeFile({path:'BrokerBook/broker-entries.xlsx',data,directory:'DOCUMENTS',recursive:true})}
 catch(e){r=await FS.writeFile({path:'broker-entries.xlsx',data,directory:'EXTERNAL',recursive:true})}
 if(!silent)try{await C.Plugins.Share.share({title:'Broker entries',url:r.uri})}catch(e){}
}
async function exportXlsx(silent){
 if(!entries.length){if(!silent)toast('No entries to export');return}
 const d=new Date().toISOString().slice(0,10);
 try{
  if(window.XLSX){const ws=XLSX.utils.json_to_sheet(rows()),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Entries');await saveXlsx(wb,silent)}
  else{const r=rows(),h=Object.keys(r[0]),csv=[h,...r.map(o=>h.map(k=>o[k]))].map(a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='broker-entries.csv';a.click();
   if(!silent)toast('Excel library not loaded (offline). Saved as CSV instead.')}
  cfg.lastExport=Date.now();saveCfg();updateStatus();if(!silent)toast('Excel downloaded')
 }catch(x){toast('Export failed: '+x.message)}
}

/* ---------- connectivity pill ---------- */
function updateStatus(){
 const on=navigator.onLine,s=$('status');
 s.textContent=`● ${entries.length} saved · ${on?'Online':'Offline'}${cfg.lastExport?' · Excel '+new Date(cfg.lastExport).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):''}`;
 s.title='Entries are stored on this phone. Tap to download Excel.';
}
$('status').onclick=()=>exportXlsx(false);
addEventListener('online',updateStatus);addEventListener('offline',updateStatus);

/* ---------- location + theme ---------- */
$('locBtn').onclick=()=>{
 if(!navigator.geolocation){toast('Location not supported on this browser');return}
 const b=$('locBtn');b.textContent='Locating…';
 navigator.geolocation.getCurrentPosition(pos=>{
  $('map').value=`https://www.google.com/maps?q=${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
  b.textContent='Use my location';toast('Location added')},
 err=>{b.textContent='Use my location';toast(err.code===1?'Allow location permission and try again':'Could not get location')},
 {enableHighAccuracy:true,timeout:15000})};
function applyTheme(){if(cfg.theme==='sleek')cfg.theme='light';let t=cfg.theme;
 if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
 const d={light:'sleek',dark:'sleekdark'}[t]||'';
 document.documentElement.dataset.theme=d;try{localStorage.setItem('bb-theme',d)}catch(e){}}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>cfg.theme==='auto'&&applyTheme());
$('theme').onchange=async()=>{cfg.theme=$('theme').value;await saveCfg();applyTheme()};

/* ---------- init ---------- */
(async()=>{
 try{await open();const c=await p(tx('cfg').get('cfg'));if(c)cfg=Object.assign(cfg,c);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  await load()}catch(x){toast('Storage unavailable: '+x.message)}
 cfg.menu=[...cfg.menu.filter(k=>titles[k]),...Object.keys(titles).filter(k=>!cfg.menu.includes(k))];
 applyTheme();resetForm();updateStatus();go('list');renderMenu();
})();
</script>
</body>
</html>
